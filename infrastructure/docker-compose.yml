version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: factoryos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-factoryos_ai}
      POSTGRES_USER: ${DB_USER:-factoryos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-factoryos_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-factoryos_user} -d ${DB_NAME:-factoryos_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
